<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Convierte fácilmente temperaturas entre Celsius, Fahrenheit y Kelvin.">
  <title>Conversor de Temperaturas | °C °F K</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="converter-card" aria-labelledby="app-title">
      <header class="app-header">
        <div class="temperature-icon" aria-hidden="true">🌡️</div>
        <div>
          <h1 id="app-title">Conversor de Temperaturas</h1>
          <p>Convierte fácilmente entre Celsius, Fahrenheit y Kelvin.</p>
        </div>
      </header>

      <form id="converter-form" novalidate>
        <div class="input-group">
          <label for="temperature">Temperatura</label>
          <input
            id="temperature"
            name="temperature"
            type="number"
            inputmode="decimal"
            step="any"
            placeholder="Ej. 25"
            autocomplete="off"
            aria-describedby="error-message"
          >
          <p id="error-message" class="message error" role="alert" aria-live="polite"></p>
        </div>

        <div class="units-grid">
          <div class="input-group">
            <label for="from-unit">De</label>
            <select id="from-unit" name="from-unit">
              <option value="C">Celsius (°C)</option>
              <option value="F">Fahrenheit (°F)</option>
              <option value="K">Kelvin (K)</option>
            </select>
          </div>

          <button id="swap-btn" class="swap-btn" type="button" aria-label="Intercambiar unidades" title="Intercambiar unidades">
            ⇄
          </button>

          <div class="input-group">
            <label for="to-unit">A</label>
            <select id="to-unit" name="to-unit">
              <option value="C">Celsius (°C)</option>
              <option value="F" selected>Fahrenheit (°F)</option>
              <option value="K">Kelvin (K)</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button id="convert-btn" class="primary-btn" type="submit">Convertir</button>
          <button id="clear-btn" class="secondary-btn" type="button">Limpiar</button>
        </div>
      </form>

      <section id="result-panel" class="result-panel" aria-live="polite">
        <span class="result-label">Resultado</span>
        <div id="result-value" class="result-value">—</div>
        <p id="result-description" class="result-description">Ingresa una temperatura para comenzar.</p>

        <div id="temperature-status" class="temperature-status neutral">
          <span id="status-icon" aria-hidden="true">🌡️</span>
          <span id="status-text">Esperando temperatura</span>
        </div>
      </section>

      <footer class="app-footer">
        <span>°C Celsius</span>
        <span>°F Fahrenheit</span>
        <span>K Kelvin</span>
      </footer>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
